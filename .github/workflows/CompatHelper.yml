name: CompatHelper

on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch:

jobs:
  compathelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Run CompatHelper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV }}
        run: |
          julia --color=yes -e 'using Pkg; Pkg.add("CompatHelper"); using CompatHelper; CompatHelper.main()'
